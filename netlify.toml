[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"
  # Le scan de secrets produit des faux positifs sur .env.example et les docs
  # (ex: VITE_MONDIAL_RELAY_BRAND=CC20GQ7Y). Les vrais secrets sont dans Netlify.
  SECRETS_SCAN_ENABLED = "false"
